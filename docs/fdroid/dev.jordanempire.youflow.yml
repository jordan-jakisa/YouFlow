# Draft recipe for https://gitlab.com/fdroid/fdroiddata (metadata/dev.jordanempire.youflow.yml).
# Not submitted. `commit` is the v0.2.0 tag; if the tag is moved, update it. See README.md here.
# The build needs JDK 17 (NewPipeExtractor's toolchain) and JDK 21 (the app). The build server runs
# Debian trixie, which has only 21, so 17 comes from bookworm the way NewPipe's recipe does it.
AntiFeatures:
  NonFreeNet:
    en-US: Depends on YouTube, a proprietary network service.
Categories:
  - Internet
  - Multimedia
  - Online Media Player
License: GPL-3.0-or-later
AuthorName: Jordan Mungujakisa
WebSite: https://github.com/jordan-jakisa/YouFlow
SourceCode: https://github.com/jordan-jakisa/YouFlow

RepoType: git
Repo: https://github.com/jordan-jakisa/YouFlow

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: ebb443a28f939af22aa5236a08929f48efc335ae
    subdir: app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: buildSrc/src/main/kotlin/ProjectConfig.kt|NEWPIPE_VERSION_CODE\s=\s(\d+)|.|NEWPIPE_VERSION_NAME\s=\s\"(.*)"
CurrentVersion: 0.2.0
CurrentVersionCode: 2
